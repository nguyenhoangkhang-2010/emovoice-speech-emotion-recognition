<div class="ev ev-hero" style="--emo:{{color}};">
  <div class="ev-hero-top">
    <span class="ev-eyebrow">{{eyebrow}}</span>
    <span class="ev-meta">{{eyebrow_sub}}</span>
    <span class="ev-tag ev-hero-badge">{{badge}}</span>
  </div>
  <div class="ev-hero-main">
    <div class="ev-hero-swatch" style="background:{{color}};"><span class="ev-icon ev-icon-xl">{{icon}}</span></div>
    <div class="ev-hero-heading">
      <p class="ev-hero-chip">{{chip_text}}</p>
      <h1 class="ev-display ev-hero-name">{{label_vi}}</h1>
      <p class="ev-hero-en">{{label_en}}</p>
    </div>
  </div>
  <div class="ev-conf">
    <div class="ev-conf-row">
      <span class="ev-conf-label">{{confidence_label}}</span>
      <span class="ev-conf-num ev-tnum" title="{{tooltip}}">{{confidence_text}}</span>
    </div>
    <div class="ev-gauge"><div class="ev-gauge-fill" style="width:{{confidence_width}}%;background:{{color}};"></div></div>
    <span class="ev-conf-threshold">{{threshold_text}}</span>
  </div>
  <p class="ev-body-text">{{description}}</p>
  <div class="ev-hero-foot"><span class="ev-meta">{{foot_left}}</span><span class="ev-meta ev-tnum">{{foot_right}}</span></div>
</div>
