<div class="ev ev-toast ev-toast-{{kind}}">
  <div class="ev-toast-icon"><span class="ev-icon ev-icon-sm">{{icon}}</span></div>
  <div class="ev-toast-body">
    <div class="ev-toast-top"><span class="ev-toast-title">{{title}}</span><span class="ev-meta">{{code}}</span></div>
    <p class="ev-sub">{{text}}</p>
  </div>
</div>
