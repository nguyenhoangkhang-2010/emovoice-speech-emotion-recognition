<div class="ev ev-status-row">
  <div class="ev-status-row-top">
    <div><div class="ev-status-name">{{name}}</div><div class="ev-meta">{{description}}</div></div>
    <span class="ev-dot ev-dot-lg ev-dot-{{tone}}"></span>
  </div>
  <div class="ev-status-row-bottom"><span class="ev-status-text ev-tone-{{tone}}"><span class="ev-icon ev-icon-sm">{{icon}}</span>{{status_text}}</span><span class="ev-meta-strong ev-tnum">{{metric}}</span></div>
</div>
