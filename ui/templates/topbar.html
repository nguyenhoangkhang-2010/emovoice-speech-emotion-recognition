<div class="ev ev-topbar">
  <div class="ev-breadcrumb">{{breadcrumb_html}}</div>
  <div class="ev-topbar-right">
    <div class="ev-status-pill"><span class="ev-dot ev-dot-teal"></span><span>{{status_text}}</span></div>
    <span class="ev-bell"><span class="ev-icon">notifications</span><span class="ev-bell-dot"></span></span>
    <span class="ev-divider-v"></span>
    <div class="ev-topbar-user"><div class="ev-avatar">{{initials}}</div><span class="ev-topbar-name">{{name}}</span></div>
  </div>
</div>
