<div class="ev ev-topbar">
  <div class="ev-breadcrumb">{{breadcrumb_html}}</div>
  <div class="ev-topbar-right">
    <span class="ev-status-pill"><span class="ev-dot ev-dot-live"></span><span>{{status_text}}</span></span>
    <span class="ev-folio-date">{{date_text}}</span>
    <button type="button" class="ev-theme-toggle" aria-label="{{theme_label}}" title="{{theme_label}}"><span class="ev-icon ev-tt-icon">dark_mode</span></button>
  </div>
</div>
