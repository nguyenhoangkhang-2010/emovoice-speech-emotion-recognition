<div class="ev ev-xai">
  <div class="ev-sec-head">
    <div><h2 class="ev-h3">{{title}}</h2><p class="ev-meta">{{subtitle}}</p></div>
    <div class="ev-legend"><span class="ev-meta-strong">{{legend_label}}</span>{{legend_cells_html}}<span class="ev-meta">{{legend_range}}</span></div>
  </div>
  <div class="ev-xai-canvas">
    {{marker_html}}
    <div class="ev-wave">{{wave_html}}</div>
    <div class="ev-heat-strip">{{cells_html}}</div>
    <div class="ev-axis">{{axis_html}}</div>
  </div>
  <div class="ev-note"><span class="ev-icon ev-icon-primary">info</span><span>{{note_html}}</span></div>
</div>
