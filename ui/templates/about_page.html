<div class="ev ev-pub">
  <section class="ev-pub-hero">
    <span class="ev-pub-eyebrow">{{eyebrow}}</span>
    <h1 class="ev-display ev-display-xl">{{title}}</h1>
    <p class="ev-body-text">{{subtitle}}</p>
  </section>
  <section class="ev-pub-grid ev-pub-grid-3">{{cards_html}}</section>
  <section class="ev-pub-section">
    <h2 class="ev-h2">{{emotions_title}}</h2>
    <div class="ev-pub-chips">{{chips_html}}</div>
  </section>
  <section class="ev-pub-section">
    <h2 class="ev-h2">{{stats_title}}</h2>
    <p class="ev-sub">{{stats_sub}}</p>
    <div class="ev-pub-grid ev-pub-grid-4">{{stats_html}}</div>
  </section>
  <div class="ev-pub-note"><span class="ev-icon ev-icon-sm">info</span><span>{{note}}</span></div>
</div>
