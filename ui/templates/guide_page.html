<div class="ev ev-pub">
  <section class="ev-pub-hero">
    <span class="ev-pub-eyebrow">{{eyebrow}}</span>
    <h1 class="ev-display ev-display-xl">{{title}}</h1>
    <p class="ev-body-text">{{subtitle}}</p>
  </section>
  <section class="ev-pub-grid ev-pub-grid-3">{{steps_html}}</section>
  <section class="ev-pub-grid ev-pub-grid-2">
    <div class="ev-pub-card">
      <h3>{{tips_title}}</h3>
      <ul class="ev-pub-tips">{{tips_html}}</ul>
    </div>
    <div class="ev-pub-section">
      <h2 class="ev-h2">{{faq_title}}</h2>
      <div class="ev-faq">{{faq_html}}</div>
    </div>
  </section>
</div>
